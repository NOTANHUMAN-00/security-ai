# ==============================================================================
# SENTINEL-X GITHUB ACTIONS - BUILD & RELEASE
# ==============================================================================
#
# This workflow automatically builds and releases Sentinel-X when you push a tag.
#
# To create a release:
#   git tag v1.0.0
#   git push origin v1.0.0
#
# ==============================================================================

name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags (v1.0.0, v2.0.0, etc.)
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================================
  # BUILD BINARIES FOR ALL PLATFORMS
  # ============================================================================
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Linux
          - goos: linux
            goarch: amd64
            suffix: ''
          - goos: linux
            goarch: arm64
            suffix: ''
          # Windows
          - goos: windows
            goarch: amd64
            suffix: '.exe'
          - goos: windows
            goarch: arm64
            suffix: '.exe'
          # macOS
          - goos: darwin
            goarch: amd64
            suffix: ''
          - goos: darwin
            goarch: arm64
            suffix: ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          # Build main server
          go build -ldflags="-s -w -X main.Version=${{ steps.version.outputs.VERSION }}" \
            -o dist/sentinel-x-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }} \
            ./cmd/server/main.go
          
          # Build pro version
          go build -ldflags="-s -w -X main.Version=${{ steps.version.outputs.VERSION }}" \
            -o dist/sentinel-pro-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }} \
            ./cmd/sentinel-pro/main.go
          
          # Build ultimate version
          go build -ldflags="-s -w -X main.Version=${{ steps.version.outputs.VERSION }}" \
            -o dist/sentinel-ultimate-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }} \
            ./cmd/sentinel-ultimate/main.go

      - name: Build WASM client
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        env:
          GOOS: js
          GOARCH: wasm
        run: |
          go build -o dist/sentinel-client.wasm ./pkg/wasm/main.go
          cp "$(go env GOROOT)/misc/wasm/wasm_exec.js" dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-x-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 1

  # ============================================================================
  # BUILD DOCKER IMAGE
  # ============================================================================
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # CREATE GITHUB RELEASE
  # ============================================================================
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, docker]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Create release archives
        run: |
          cd dist
          
          # Create archives for each platform
          for file in sentinel-x-*; do
            if [[ -f "$file" ]]; then
              platform="${file#sentinel-x-}"
              mkdir -p "sentinel-x-${platform}"
              cp "$file" "sentinel-x-${platform}/"
              cp sentinel-client.wasm "sentinel-x-${platform}/" 2>/dev/null || true
              cp wasm_exec.js "sentinel-x-${platform}/" 2>/dev/null || true
              
              if [[ "$platform" == *"windows"* ]]; then
                zip -r "sentinel-x-${platform}.zip" "sentinel-x-${platform}"
              else
                tar -czf "sentinel-x-${platform}.tar.gz" "sentinel-x-${platform}"
              fi
            fi
          done

      - name: Generate changelog
        id: changelog
        run: |
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "## What's Changed" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          git log --pretty=format:"* %s" $(git describe --tags --abbrev=0 HEAD^)..HEAD >> $GITHUB_OUTPUT || echo "* Initial release" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Sentinel-X ${{ github.ref_name }}
          body: |
            # Sentinel-X ${{ github.ref_name }}
            
            🛡️ **Enterprise Anti-Bot WAF & Reverse Proxy**
            
            ${{ steps.changelog.outputs.CHANGELOG }}
            
            ## Installation
            
            ### Docker (Recommended)
            ```bash
            docker run -p 8080:8080 \
              -e TARGET_URL=http://your-app:3000 \
              ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ```
            
            ### Binary
            Download the appropriate binary for your platform below.
            
            ### One-Line Install (Linux/Mac)
            ```bash
            curl -sL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash
            ```
            
            ## Checksums
            See `checksums.txt` for SHA256 checksums of all binaries.
            
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/sentinel-x-*
            dist/sentinel-pro-*
            dist/sentinel-ultimate-*
            dist/sentinel-client.wasm
            dist/wasm_exec.js
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # GENERATE CHECKSUMS
  # ============================================================================
  checksums:
    name: Generate Checksums
    runs-on: ubuntu-latest
    needs: release

    steps:
      - name: Download release assets
        run: |
          gh release download ${{ github.ref_name }} -D dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Upload checksums
        run: |
          gh release upload ${{ github.ref_name }} dist/checksums.txt --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
